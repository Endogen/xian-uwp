[tool.poetry]
name = "xian-uwp"
version = "2.0.0"
description = "Xian Universal Wallet Protocol - Reference implementation in Python"
authors = ["Xian Network <protocol@xian.org>"]
readme = "README.md"
packages = [{include = "xian_uwp"}]
repository = "https://github.com/xian-network/xian-uwp"
documentation = "https://github.com/xian-network/xian-uwp/blob/main/protocol/SPECIFICATION.md"
keywords = ["blockchain", "wallet", "xian", "protocol", "dapp"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
]

[tool.poetry.dependencies]
python = "^3.11"
xian-py = "^0.4.5"
fastapi = "^0.116.1"
uvicorn = "^0.35.0"
httpx = "^0.28.1"
websockets = "^15.0.1"
pydantic = "^2.11.7"
argon2-cffi = "^23.1.0"

[tool.poetry.group.test.dependencies]
pytest = "^8.0.0"
pytest-asyncio = "^0.24.0"
pytest-cov = "^6.0.0"
pytest-mock = "^3.14.0"

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
addopts = [
    "-v",
    "--tb=short",
    "--strict-markers",
    "--disable-warnings",
    "--cov=xian_uwp",
    "--cov-report=term-missing",
    "--cov-report=html:htmlcov",
]
markers = [
    "unit: Unit tests",
    "integration: Integration tests", 
    "e2e: End-to-end tests",
    "cors: CORS functionality tests",
    "slow: Slow running tests",
]

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"
