openapi: 3.0.3
info:
  title: Xian Universal Wallet Protocol
  version: 2.0.0
  description: |
    Language-agnostic protocol specification for wallet and DApp communication on the Xian blockchain.
    
    This specification defines the standard interface that all wallet implementations must provide,
    enabling any DApp to communicate with any wallet regardless of implementation language.
  license:
    name: MIT
    url: https://opensource.org/licenses/MIT
  contact:
    name: Xian Network
    url: https://xian.org
    email: protocol@xian.org

servers:
  - url: http://localhost:8545/api/v1
    description: Default local wallet server (HTTP)
  - url: https://localhost:8546/api/v1
    description: Default local wallet server (HTTPS)
  - url: http://{host}:{port}/api/v1
    description: Custom wallet server
    variables:
      host:
        default: localhost
        description: Wallet server hostname
      port:
        default: '8545'
        description: Wallet server port
  - url: wss://{relay}/api/v1
    description: Relay server for mobile bridge
    variables:
      relay:
        default: relay.xian.org
        description: Relay server hostname

tags:
  - name: Status
    description: Wallet status and health endpoints
  - name: Discovery
    description: Wallet discovery and registration
  - name: Pairing
    description: Mobile wallet pairing via QR/deep links
  - name: Authorization
    description: DApp authorization and session management
  - name: Wallet
    description: Wallet information and management
  - name: Transactions
    description: Transaction operations
  - name: Tokens
    description: Token management
  - name: Relay
    description: Relay server operations for mobile bridge
  - name: WebSocket
    description: Real-time event streaming via WebSocket

paths:
  /wallet/status:
    get:
      tags: [Status]
      summary: Get wallet status
      description: Check if wallet is available and get basic status information. No authentication required.
      operationId: getWalletStatus
      responses:
        '200':
          description: Wallet status retrieved successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WalletStatus'
        '503':
          description: Wallet service unavailable
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /discovery/wallets:
    get:
      tags: [Discovery]
      summary: Discover available wallets
      description: Query available wallets via mDNS or registry service
      operationId: discoverWallets
      parameters:
        - name: method
          in: query
          description: Discovery method to use
          schema:
            type: string
            enum: [mdns, registry, all]
            default: all
        - name: type
          in: query
          description: Filter by wallet type
          schema:
            type: string
            enum: [desktop, mobile, hardware, web]
      responses:
        '200':
          description: List of discovered wallets
          content:
            application/json:
              schema:
                type: object
                properties:
                  wallets:
                    type: array
                    items:
                      $ref: '#/components/schemas/DiscoveredWallet'

  /discovery/register:
    post:
      tags: [Discovery]
      summary: Register wallet with discovery service
      description: Register this wallet with the discovery registry
      operationId: registerWallet
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/WalletRegistration'
      responses:
        '201':
          description: Wallet registered successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  wallet_id:
                    type: string
                  registered_at:
                    type: string
                    format: date-time

  /pairing/request:
    post:
      tags: [Pairing]
      summary: Create pairing request
      description: Generate a new pairing request for QR code or deep link
      operationId: createPairingRequest
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PairingRequest'
      responses:
        '201':
          description: Pairing request created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PairingResponse'

  /pairing/connect:
    post:
      tags: [Pairing]
      summary: Connect via pairing
      description: Connect to a DApp using pairing data from QR code or deep link
      operationId: connectPairing
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PairingConnect'
      responses:
        '200':
          description: Pairing successful
          content:
            application/json:
              schema:
                type: object
                properties:
                  session_id:
                    type: string
                  relay_url:
                    type: string
                  encrypted_channel:
                    type: boolean

  /relay/message:
    post:
      tags: [Relay]
      summary: Send relay message
      description: Send an encrypted message through the relay server
      operationId: sendRelayMessage
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RelayMessage'
      responses:
        '202':
          description: Message queued for relay
          content:
            application/json:
              schema:
                type: object
                properties:
                  message_id:
                    type: string
                  queued_at:
                    type: string
                    format: date-time

  /auth/request:
    post:
      tags: [Authorization]
      summary: Request authorization
      description: Request authorization from the wallet for DApp access
      operationId: requestAuthorization
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AuthorizationRequest'
      responses:
        '202':
          description: Authorization request accepted and pending
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthorizationPending'
        '400':
          description: Invalid request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '429':
          description: Too many pending requests
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /auth/status/{request_id}:
    get:
      tags: [Authorization]
      summary: Check authorization status
      description: Check the status of a pending authorization request
      operationId: getAuthorizationStatus
      parameters:
        - name: request_id
          in: path
          required: true
          description: Authorization request ID
          schema:
            type: string
            pattern: '^[a-zA-Z0-9_-]{16,}$'
      responses:
        '200':
          description: Authorization status retrieved
          content:
            application/json:
              schema:
                oneOf:
                  - $ref: '#/components/schemas/AuthorizationPending'
                  - $ref: '#/components/schemas/AuthorizationApproved'
                  - $ref: '#/components/schemas/AuthorizationDenied'
        '404':
          description: Request not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /auth/approve/{request_id}:
    post:
      tags: [Authorization]
      summary: Approve authorization request
      description: Approve a pending authorization request (wallet UI operation)
      operationId: approveAuthorization
      parameters:
        - name: request_id
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Authorization approved
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthorizationApproved'
        '404':
          description: Request not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /auth/deny/{request_id}:
    post:
      tags: [Authorization]
      summary: Deny authorization request
      description: Deny a pending authorization request (wallet UI operation)
      operationId: denyAuthorization
      parameters:
        - name: request_id
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Authorization denied
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthorizationDenied'
        '404':
          description: Request not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /auth/revoke:
    post:
      tags: [Authorization]
      summary: Revoke authorization
      description: Revoke current session authorization
      operationId: revokeAuthorization
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Authorization revoked
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    example: revoked
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /wallet/info:
    get:
      tags: [Wallet]
      summary: Get wallet information
      description: Get detailed wallet information
      operationId: getWalletInfo
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Wallet information retrieved
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WalletInfo'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '403':
          description: Insufficient permissions
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /wallet/unlock:
    post:
      tags: [Wallet]
      summary: Unlock wallet
      description: Unlock wallet with password
      operationId: unlockWallet
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UnlockRequest'
      responses:
        '200':
          description: Wallet unlocked successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    example: unlocked
        '401':
          description: Invalid password
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '429':
          description: Too many failed attempts
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /wallet/lock:
    post:
      tags: [Wallet]
      summary: Lock wallet
      description: Lock the wallet
      operationId: lockWallet
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Wallet locked successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    example: locked
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /balance/{contract}:
    get:
      tags: [Tokens]
      summary: Get token balance
      description: Get balance for a specific token contract
      operationId: getBalance
      security:
        - bearerAuth: []
      parameters:
        - name: contract
          in: path
          required: true
          description: Token contract name (use 'currency' for native token)
          schema:
            type: string
            example: currency
      responses:
        '200':
          description: Balance retrieved successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BalanceResponse'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '403':
          description: Insufficient permissions
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: Contract not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /balance/{contract}/{spender}:
    get:
      tags: [Tokens]
      summary: Get approved balance
      description: Get approved balance for a spender on a token contract
      operationId: getApprovedBalance
      security:
        - bearerAuth: []
      parameters:
        - name: contract
          in: path
          required: true
          schema:
            type: string
        - name: spender
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Approved balance retrieved
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApprovedBalanceResponse'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '403':
          description: Insufficient permissions
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /transaction:
    post:
      tags: [Transactions]
      summary: Send transaction
      description: Send a transaction to the blockchain
      operationId: sendTransaction
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TransactionRequest'
      responses:
        '200':
          description: Transaction sent successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TransactionResult'
        '400':
          description: Invalid transaction
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '403':
          description: Insufficient permissions
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '423':
          description: Wallet is locked
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /sign:
    post:
      tags: [Transactions]
      summary: Sign message
      description: Sign a message with the wallet's private key
      operationId: signMessage
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SignMessageRequest'
      responses:
        '200':
          description: Message signed successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SignatureResponse'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '403':
          description: Insufficient permissions
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '423':
          description: Wallet is locked
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /tokens/add:
    post:
      tags: [Tokens]
      summary: Add custom token
      description: Add a custom token to the wallet
      operationId: addToken
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AddTokenRequest'
      responses:
        '200':
          description: Token added successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    example: added
                  contract:
                    type: string
        '400':
          description: Invalid token
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '403':
          description: Insufficient permissions
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /tokens:
    get:
      tags: [Tokens]
      summary: List tokens
      description: List all tokens in the wallet
      operationId: listTokens
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Tokens retrieved successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  tokens:
                    type: array
                    items:
                      $ref: '#/components/schemas/TokenInfo'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /auth/refresh:
    post:
      tags: [Authorization]
      summary: Refresh session token
      description: |
        Use a refresh token to obtain a new session token without re-authorization.
        This is an optional feature - wallets may choose not to implement refresh tokens.
      operationId: refreshToken
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - refresh_token
              properties:
                refresh_token:
                  type: string
                  description: The refresh token obtained during initial authorization
                  example: "rt_1234567890abcdef"
      responses:
        '200':
          description: Token refreshed successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RefreshTokenResponse'
        '400':
          description: Invalid refresh token format
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          description: Invalid or expired refresh token
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '501':
          description: Refresh tokens not supported by this wallet
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /auth/revoke-refresh:
    post:
      tags: [Authorization]
      summary: Revoke refresh token
      description: |
        Revoke a refresh token to prevent it from being used to obtain new session tokens.
        This is an optional feature - wallets may choose not to implement refresh tokens.
      operationId: revokeRefreshToken
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - refresh_token
              properties:
                refresh_token:
                  type: string
                  description: The refresh token to revoke
                  example: "rt_1234567890abcdef"
      responses:
        '200':
          description: Refresh token revoked successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    example: revoked
        '400':
          description: Invalid request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '501':
          description: Refresh tokens not supported by this wallet
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /dapp/register:
    post:
      tags: [Authorization]
      summary: Register DApp identity (Optional)
      description: |
        Register a DApp with its public key for identity verification.
        This is an optional protocol extension - wallets may choose not to implement DApp verification.
        DApps that are not registered can still connect but may show warnings to users.
      operationId: registerDApp
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DAppRegistration'
      responses:
        '200':
          description: DApp registered successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DAppRegistrationResponse'
        '400':
          description: Invalid registration data
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '409':
          description: DApp already registered with different key
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '501':
          description: DApp registration not supported by this wallet
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /dapp/verify:
    post:
      tags: [Authorization]
      summary: Verify DApp signature (Optional)
      description: |
        Verify a DApp's signature to confirm its identity.
        This is an optional protocol extension used internally by wallets that support DApp verification.
      operationId: verifyDApp
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - dapp_id
                - message
                - signature
              properties:
                dapp_id:
                  type: string
                  description: DApp identifier
                message:
                  type: string
                  description: Message that was signed
                signature:
                  type: string
                  description: Signature to verify
      responses:
        '200':
          description: Signature verification result
          content:
            application/json:
              schema:
                type: object
                properties:
                  valid:
                    type: boolean
                    description: Whether the signature is valid
                  dapp_info:
                    $ref: '#/components/schemas/DAppInfo'
        '404':
          description: DApp not registered
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '501':
          description: DApp verification not supported
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /ws/v1:
    get:
      tags: [WebSocket]
      summary: WebSocket connection for real-time events
      description: |
        Establishes WebSocket connection for receiving real-time authorization events.
        Authentication is required via Bearer token in Authorization header or token query parameter.
        The connection will be closed if the token expires or is revoked.
      operationId: connectWebSocket
      security:
        - bearerAuth: []
      parameters:
        - name: Authorization
          in: header
          required: false
          schema:
            type: string
            pattern: '^Bearer .+$'
          description: Bearer token for authentication (preferred method)
        - name: token
          in: query
          required: false
          schema:
            type: string
          description: Session token for authentication (fallback for clients that cannot set headers)
      responses:
        '101':
          description: Switching Protocols - WebSocket connection established
        '401':
          description: Unauthorized - Missing or invalid authentication token
        '403':
          description: Forbidden - Token lacks required permissions
        '400':
          description: Bad Request

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      description: Session token obtained from authorization flow

  schemas:
    WalletType:
      type: string
      enum: [desktop, web, cli, hardware, mobile]
      description: Type of wallet implementation

    DiscoveredWallet:
      type: object
      required: [wallet_id, name, type, endpoint]
      properties:
        wallet_id:
          type: string
          description: Unique wallet identifier
        name:
          type: string
          description: Display name of the wallet
        type:
          $ref: '#/components/schemas/WalletType'
        endpoint:
          type: string
          description: Wallet API endpoint URL
        version:
          type: string
          description: Protocol version supported
        capabilities:
          type: array
          items:
            type: string
            enum: [qr_pairing, deep_linking, relay_bridge, websocket]
          description: Supported capabilities
        icon:
          type: string
          description: URL to wallet icon

    WalletRegistration:
      type: object
      required: [wallet_id, name, type, endpoint]
      properties:
        wallet_id:
          type: string
          description: Unique wallet identifier
        name:
          type: string
          description: Display name of the wallet
        type:
          $ref: '#/components/schemas/WalletType'
        endpoint:
          type: string
          description: Wallet API endpoint URL
        public_key:
          type: string
          description: Public key for verification
        capabilities:
          type: array
          items:
            type: string
          description: Supported capabilities
        metadata:
          type: object
          description: Additional wallet metadata

    PairingRequest:
      type: object
      required: [app_name, app_url]
      properties:
        app_name:
          type: string
          description: Name of the DApp
        app_url:
          type: string
          description: URL of the DApp
        relay_url:
          type: string
          description: Relay server URL for mobile bridge
        permissions:
          type: array
          items:
            $ref: '#/components/schemas/Permission'
        expiry_seconds:
          type: integer
          default: 300
          description: Pairing request expiry time

    PairingResponse:
      type: object
      required: [pairing_id, qr_data, deep_link]
      properties:
        pairing_id:
          type: string
          description: Unique pairing identifier
        qr_data:
          type: string
          description: Data to encode in QR code
        deep_link:
          type: string
          description: Deep link URL for mobile wallets
        relay_url:
          type: string
          description: Relay server URL if using mobile bridge
        public_key:
          type: string
          description: Public key for E2E encryption

    PairingConnect:
      type: object
      required: [pairing_data]
      properties:
        pairing_data:
          type: string
          description: Data from QR code or deep link
        wallet_public_key:
          type: string
          description: Wallet's public key for E2E encryption

    RelayMessage:
      type: object
      required: [session_id, encrypted_payload]
      properties:
        session_id:
          type: string
          description: Session identifier for routing
        from:
          type: string
          enum: [dapp, wallet]
          description: Message sender type
        encrypted_payload:
          type: string
          description: Base64 encoded encrypted message
        timestamp:
          type: string
          format: date-time
          description: Message timestamp

    Permission:
      type: string
      enum: [wallet_info, balance, transactions, sign_message, add_token]
      description: Permission that can be granted to a DApp

    WalletStatus:
      type: object
      required: [available, locked, wallet_type, version]
      properties:
        available:
          type: boolean
          description: Whether wallet is available
        locked:
          type: boolean
          description: Whether wallet is locked
        wallet_type:
          $ref: '#/components/schemas/WalletType'
        network:
          type: string
          description: Network URL
          example: https://testnet.xian.org
        chain_id:
          type: string
          description: Chain identifier
          example: xian-testnet-1
        version:
          type: string
          description: Protocol version
          example: 2.0.0

    AuthorizationRequest:
      type: object
      required: [app_name, app_url, permissions]
      properties:
        app_name:
          type: string
          minLength: 1
          maxLength: 100
          description: Name of the requesting application
          example: My DApp
        app_url:
          type: string
          format: uri
          description: URL of the requesting application
          example: https://mydapp.example.com
        permissions:
          type: array
          minItems: 1
          items:
            $ref: '#/components/schemas/Permission'
          description: Requested permissions
        description:
          type: string
          maxLength: 500
          description: Optional description of why permissions are needed
          example: Access needed to display balance and send transactions
        dapp_id:
          type: string
          description: Optional DApp identifier if registered
          example: "dapp_1234567890"
        signature:
          type: string
          description: Optional signature of the request for DApp verification
        timestamp:
          type: integer
          description: Optional Unix timestamp for replay protection (required if signature is provided)
          example: 1234567890

    AuthorizationPending:
      type: object
      required: [request_id, status, app_name]
      properties:
        request_id:
          type: string
          description: Unique request identifier
        status:
          type: string
          enum: [pending]
        app_name:
          type: string
        app_url:
          type: string
        permissions:
          type: array
          items:
            $ref: '#/components/schemas/Permission'
        description:
          type: string

    AuthorizationApproved:
      type: object
      required: [session_token, expires_at, permissions, status]
      properties:
        session_token:
          type: string
          description: Session token for authenticated requests
        refresh_token:
          type: string
          description: Optional refresh token for renewing sessions (if supported by wallet)
        expires_at:
          type: string
          format: date-time
          description: Token expiration time
        refresh_expires_at:
          type: string
          format: date-time
          description: Refresh token expiration time (if refresh_token is provided)
        permissions:
          type: array
          items:
            $ref: '#/components/schemas/Permission'
        status:
          type: string
          enum: [approved]

    AuthorizationDenied:
      type: object
      required: [status]
      properties:
        status:
          type: string
          enum: [denied]
        reason:
          type: string
          description: Optional reason for denial

    WalletInfo:
      type: object
      required: [address, locked, wallet_type, version]
      properties:
        address:
          type: string
          description: Wallet address
          example: "0x1234567890abcdef1234567890abcdef12345678"
        truncated_address:
          type: string
          description: Truncated wallet address for display
          example: "0x1234...5678"
        locked:
          type: boolean
          description: Whether wallet is currently locked
        chain_id:
          type: string
          description: Current chain ID
        network:
          type: string
          description: Current network URL
        wallet_type:
          $ref: '#/components/schemas/WalletType'
        version:
          type: string
          description: Wallet version

    UnlockRequest:
      type: object
      required: [password]
      properties:
        password:
          type: string
          format: password
          description: Wallet password
          minLength: 1

    BalanceResponse:
      type: object
      required: [balance, contract]
      properties:
        balance:
          type: number
          description: Token balance
          example: 1000.5
        contract:
          type: string
          description: Token contract name
          example: currency
        symbol:
          type: string
          description: Token symbol
          example: XIAN
        decimals:
          type: integer
          description: Token decimals
          example: 18

    ApprovedBalanceResponse:
      type: object
      required: [approved_amount, contract, spender]
      properties:
        approved_amount:
          type: number
          description: Approved amount
        contract:
          type: string
          description: Token contract
        spender:
          type: string
          description: Spender address

    TransactionRequest:
      type: object
      required: [contract, function, kwargs]
      properties:
        contract:
          type: string
          minLength: 1
          maxLength: 100
          description: Smart contract name
          example: currency
        function:
          type: string
          minLength: 1
          maxLength: 100
          description: Contract function to call
          example: transfer
        kwargs:
          type: object
          description: Function arguments
          example:
            to: "0xrecipient"
            amount: 100
        stamps_supplied:
          type: integer
          minimum: 0
          description: Gas limit for transaction
          example: 50000

    TransactionResult:
      type: object
      required: [success]
      properties:
        success:
          type: boolean
          description: Whether transaction was successful
        transaction_hash:
          type: string
          description: Transaction hash if successful
          example: "0xabcdef1234567890abcdef1234567890abcdef1234567890abcdef1234567890"
        result:
          type: object
          description: Transaction result data
        errors:
          type: array
          items:
            type: string
          description: Error messages if failed
        gas_used:
          type: integer
          description: Gas used by transaction

    SignMessageRequest:
      type: object
      required: [message]
      properties:
        message:
          type: string
          minLength: 1
          maxLength: 10000
          description: Message to sign
          example: "Hello, Xian!"

    SignatureResponse:
      type: object
      required: [signature, message, address]
      properties:
        signature:
          type: string
          description: Message signature
          example: "0xsignature"
        message:
          type: string
          description: Original message
        address:
          type: string
          description: Signing address

    AddTokenRequest:
      type: object
      required: [contract_address]
      properties:
        contract_address:
          type: string
          minLength: 1
          maxLength: 100
          description: Token contract address
        token_name:
          type: string
          maxLength: 100
          description: Token name
        token_symbol:
          type: string
          maxLength: 20
          description: Token symbol
        decimals:
          type: integer
          minimum: 0
          maximum: 18
          description: Token decimals

    TokenInfo:
      type: object
      properties:
        contract:
          type: string
          description: Token contract address
        name:
          type: string
          description: Token name
        symbol:
          type: string
          description: Token symbol
        decimals:
          type: integer
          description: Token decimals
        balance:
          type: number
          description: Current balance

    Error:
      type: object
      required: [error, code]
      properties:
        error:
          type: string
          description: Error message
        code:
          type: string
          description: Error code
          enum:
            - WALLET_LOCKED
            - UNAUTHORIZED
            - SESSION_EXPIRED
            - INVALID_REQUEST
            - NETWORK_ERROR
            - INSUFFICIENT_BALANCE
            - TRANSACTION_FAILED
            - USER_REJECTED
            - WALLET_NOT_FOUND
            - INVALID_CONTRACT
            - INVALID_SIGNATURE
            - MAX_SESSIONS_EXCEEDED
            - TOO_MANY_ATTEMPTS
            - ACCOUNT_LOCKED
        details:
          type: string
          description: Additional error details

    RefreshTokenResponse:
      type: object
      required: [session_token, expires_at]
      properties:
        session_token:
          type: string
          description: New session token
        refresh_token:
          type: string
          description: New refresh token (if rotation is enabled)
        expires_at:
          type: string
          format: date-time
          description: Session token expiration time
        refresh_expires_at:
          type: string
          format: date-time
          description: Refresh token expiration time (if rotation is enabled)

    DAppRegistration:
      type: object
      required: [app_name, app_url, public_key]
      properties:
        app_name:
          type: string
          description: DApp display name
          example: "My DeFi App"
        app_url:
          type: string
          format: uri
          description: DApp URL
          example: "https://mydefi.app"
        public_key:
          type: string
          description: DApp's public key (Ed25519 or ECDSA) in base64 or hex format
          example: "0x1234567890abcdef..."
        algorithm:
          type: string
          enum: [ed25519, ecdsa-secp256k1]
          default: ed25519
          description: Signature algorithm used by the DApp
        metadata:
          type: object
          properties:
            description:
              type: string
              description: DApp description
            icon:
              type: string
              format: uri
              description: DApp icon URL
            categories:
              type: array
              items:
                type: string
              description: DApp categories (e.g., DeFi, Gaming, NFT)

    DAppRegistrationResponse:
      type: object
      required: [dapp_id, registered_at]
      properties:
        dapp_id:
          type: string
          description: Unique identifier for the registered DApp
          example: "dapp_1234567890"
        challenge:
          type: string
          description: Optional challenge for initial verification
        registered_at:
          type: string
          format: date-time
          description: Registration timestamp
        verification_required:
          type: boolean
          description: Whether the DApp needs to complete verification

    DAppInfo:
      type: object
      required: [dapp_id, app_name, app_url, verified]
      properties:
        dapp_id:
          type: string
          description: DApp identifier
        app_name:
          type: string
          description: DApp display name
        app_url:
          type: string
          format: uri
          description: DApp URL
        verified:
          type: boolean
          description: Whether the DApp identity is verified
        trust_level:
          type: string
          enum: [unverified, domain_verified, signature_verified, fully_verified]
          description: DApp trust level
        registered_at:
          type: string
          format: date-time
          description: When the DApp was registered
        last_seen:
          type: string
          format: date-time
          description: Last activity from this DApp

webhooks:
  authorizationUpdate:
    post:
      requestBody:
        description: Authorization status update
        content:
          application/json:
            schema:
              type: object
              properties:
                type:
                  type: string
                  enum: [authorization_approved, authorization_denied, authorization_expired]
                request_id:
                  type: string
                timestamp:
                  type: string
                  format: date-time
      responses:
        '200':
          description: Webhook processed